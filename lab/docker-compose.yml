services:
  # --- Bitcoin Core (regtest) ---
  bitcoind:
    image: polarlightning/bitcoind:30.0
    container_name: lntrace-bitcoind
    command:
      - -regtest
      - -server
      - -rpcuser=lntrace
      - -rpcpassword=lntrace
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
      - -fallbackfee=0.00001
      - -txindex=1
    ports:
      - "18443:18443"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin

  # --- Build lntrace CLN plugins ---
  plugin-builder:
    build:
      context: ..
      dockerfile: lab/Dockerfile.plugin
    container_name: lntrace-plugin-builder
    volumes:
      - plugin-bin:/plugins
    entrypoint: ["sh", "-c", "cp /plugins/* /out/ 2>/dev/null; echo 'plugins ready'; ls -la /plugins/"]

  # --- Node A (sender) ---
  cln-a:
    image: elementsproject/lightningd:v26.06.8
    container_name: lntrace-cln-a
    depends_on:
      bitcoind:
        condition: service_started
      plugin-builder:
        condition: service_completed_successfully
    entrypoint: ["lightningd"]
    command:
      - --network=regtest
      - --alias=node-A
      - --bitcoin-rpcuser=lntrace
      - --bitcoin-rpcpassword=lntrace
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --log-level=debug
      - --log-file=/root/.lightning/debug.log
      - --plugin=/plugins/lntrace-cln-record
      - --lntrace-log=/logs/node-A-raw.jsonl
      - --addr=0.0.0.0:9735
    volumes:
      - cln-a-data:/root/.lightning
      - plugin-bin:/plugins:ro
      - ./logs:/logs
    ports:
      - "9735:9735"

  # --- Node B (intermediate) ---
  cln-b:
    image: elementsproject/lightningd:v26.06.8
    container_name: lntrace-cln-b
    depends_on:
      bitcoind:
        condition: service_started
      plugin-builder:
        condition: service_completed_successfully
    entrypoint: ["lightningd"]
    command:
      - --network=regtest
      - --alias=node-B
      - --bitcoin-rpcuser=lntrace
      - --bitcoin-rpcpassword=lntrace
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --log-level=debug
      - --log-file=/root/.lightning/debug.log
      - --plugin=/plugins/lntrace-cln-record
      - --lntrace-log=/logs/node-B-raw.jsonl
      - --addr=0.0.0.0:9735
    volumes:
      - cln-b-data:/root/.lightning
      - plugin-bin:/plugins:ro
      - ./logs:/logs

  # --- Node C (receiver) ---
  cln-c:
    image: elementsproject/lightningd:v26.06.8
    container_name: lntrace-cln-c
    depends_on:
      bitcoind:
        condition: service_started
      plugin-builder:
        condition: service_completed_successfully
    entrypoint: ["lightningd"]
    command:
      - --network=regtest
      - --alias=node-C
      - --bitcoin-rpcuser=lntrace
      - --bitcoin-rpcpassword=lntrace
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --log-level=debug
      - --log-file=/root/.lightning/debug.log
      - --plugin=/plugins/lntrace-cln-record
      - --lntrace-log=/logs/node-C-raw.jsonl
      - --addr=0.0.0.0:9735
    volumes:
      - cln-c-data:/root/.lightning
      - plugin-bin:/plugins:ro
      - ./logs:/logs

  # --- Node D (alternate intermediate) ---
  cln-d:
    image: elementsproject/lightningd:v26.06.8
    container_name: lntrace-cln-d
    depends_on:
      bitcoind:
        condition: service_started
      plugin-builder:
        condition: service_completed_successfully
    entrypoint: ["lightningd"]
    command:
      - --network=regtest
      - --alias=node-D
      - --bitcoin-rpcuser=lntrace
      - --bitcoin-rpcpassword=lntrace
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --log-level=debug
      - --log-file=/root/.lightning/debug.log
      - --plugin=/plugins/lntrace-cln-record
      - --lntrace-log=/logs/node-D-raw.jsonl
      - --addr=0.0.0.0:9735
    volumes:
      - cln-d-data:/root/.lightning
      - plugin-bin:/plugins:ro
      - ./logs:/logs

volumes:
  bitcoind-data:
  cln-a-data:
  cln-b-data:
  cln-c-data:
  cln-d-data:
  plugin-bin:
