services:
  # --- Bitcoin Core (regtest) ---
  bitcoind:
    image: polarlightning/bitcoind:30.0
    container_name: lntrace-bitcoind
    command:
      - -regtest
      - -server
      - -rpcuser=lntrace
      - -rpcpassword=lntrace
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
      - -fallbackfee=0.00001
      - -txindex=1
    ports:
      - "18443:18443"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin

  # --- Build lntrace CLN plugins ---
  plugin-builder:
    build:
      context: ..
      dockerfile: lab/Dockerfile.plugin
    container_name: lntrace-plugin-builder
    volumes:
      - plugin-bin:/plugins
    entrypoint: ["sh", "-c", "cp /plugins/* /out/ 2>/dev/null; echo 'plugins ready'; ls -la /plugins/"]
    # This container exits after copying. That's fine.

  # --- CLN Node A (sender, with lntrace recorder) ---
  cln-sender:
    image: polarlightning/clightning:25.02
    container_name: lntrace-cln-sender
    depends_on:
      bitcoind:
        condition: service_started
      plugin-builder:
        condition: service_completed_successfully
    command:
      - lightningd
      - --network=regtest
      - --alias=lntrace-sender
      - --bitcoin-rpcuser=lntrace
      - --bitcoin-rpcpassword=lntrace
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --log-level=debug
      - --log-file=/home/clightning/.lightning/debug.log
      - --plugin=/plugins/lntrace-cln-recorder
      - --addr=0.0.0.0:9735
    volumes:
      - cln-sender-data:/home/clightning/.lightning
      - plugin-bin:/plugins:ro
      - fixture-data:/fixtures
    ports:
      - "9735:9735"

  # --- CLN Node B (receiver) ---
  cln-receiver:
    image: polarlightning/clightning:25.02
    container_name: lntrace-cln-receiver
    depends_on:
      bitcoind:
        condition: service_started
    command:
      - lightningd
      - --network=regtest
      - --alias=lntrace-receiver
      - --bitcoin-rpcuser=lntrace
      - --bitcoin-rpcpassword=lntrace
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --log-level=debug
      - --log-file=/home/clightning/.lightning/debug.log
      - --addr=0.0.0.0:9735
    volumes:
      - cln-receiver-data:/home/clightning/.lightning

volumes:
  bitcoind-data:
  cln-sender-data:
  cln-receiver-data:
  plugin-bin:
  fixture-data:
