[workspace]
resolver = "2"
members = [
    "crates/lntrace-core",
    "crates/lntrace-collector",
    "crates/lntrace-correlator",
    "crates/lntrace-explain",
    "crates/lntrace-cli",
    "adapters/cln",
    "adapters/ldk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lntrace-core = { path = "crates/lntrace-core" }
lntrace-collector = { path = "crates/lntrace-collector" }
lntrace-correlator = { path = "crates/lntrace-correlator" }
lntrace-explain = { path = "crates/lntrace-explain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
cln-plugin = "0.2"
cln-rpc = "0.2"
