[workspace]
resolver = "2"
members = [
    "crates/lntrace",
    "crates/lntrace-cli",
    "adapters/cln",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lntrace = { path = "crates/lntrace" }
lntrace-cln = { path = "adapters/cln" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
cln-plugin = "0.7"
cln-rpc = "0.7"
