[package]
name = "lntrace-cln"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLN adapter plugin for lntrace"

[lib]
name = "lntrace_cln"
path = "src/lib.rs"

[[bin]]
name = "lntrace-cln"
path = "src/main.rs"

[[bin]]
name = "lntrace-cln-record"
path = "src/recorder.rs"

[dependencies]
lntrace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
cln-plugin = { workspace = true }
cln-rpc = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
